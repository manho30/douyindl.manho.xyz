<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' https: data:; connect-src 'self' https://douyinapis.manho30.me; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
    <title>抖音无水印视频下载</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
<h1 class="mt-20 text-3xl font-semibold text-center decoration-teal-400">
    抖音无水印视频下载
</h1>
<input class="mt-7 shadow appearance-none border rounded-full w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Place the link here" id="url">
<div class="flex items-center justify-center mt-5">
    <button type="button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mx-2 focus:outline-none focus:shadow-outline" id="download">
        Download
    </button>
    <span id="loading" class="text-yellow-400 mx-2 hidden">Loading...</span>
    <button type="button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded mx-2 focus:outline-none focus:shadow-outline" id="cancel">
        Cancel
    </button>

    <script>
        document.querySelector('#cancel').addEventListener('click', function() {
            window.location.reload();
        });

        function getURLQuery() {
            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });
            return params.url;
        }

        // windows onload
        window.onload = () => {
            const query = getURLQuery()
            if(query && query.indexOf('douyin') >= 0) {
                document.getElementById("url").value = query;
                document.getElementById("download").click();
            }
        }
        document.querySelector('#download').addEventListener('click', async function() {
            // Clear previous results
            document.getElementById("title").textContent = "";
            const thumbnail = document.getElementById("thumbnail");
            thumbnail.src = "";
            thumbnail.alt = "";
            document.getElementById("watermark").innerHTML = "";
            document.getElementById("no_watermark").innerHTML = "";
            
            var url = document.querySelector('#url').value;
            if (url.length == 0) {
                alert('Please input a link');
                return;
            }
            const regex = /https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&\/\/=]*)/gm
            const destination = regex.exec(url)
            if (!destination || !destination[0] || destination[0].toString().indexOf('douyin') < 0){
                alert('Invalid URL')
                return;
            }
            if (url.indexOf('user') >= 0) {
                alert('Batch download is not supported yet');
                return;
            }

            // Enable loading state
            const downloadBtn = document.getElementById('download');
            const loadingIndicator = document.getElementById('loading');
            downloadBtn.disabled = true;
            loadingIndicator.classList.remove('hidden');

            try {
                // Encode URL parameter properly
                const encodedUrl = encodeURIComponent(url);
                const idResponse = await fetch(`https://douyinapis.manho30.me/id?link=${encodedUrl}`);
                
                if (!idResponse.ok) {
                    throw new Error(`HTTP error! status: ${idResponse.status}`);
                }
                
                const idData = await idResponse.json();
                
                // Validate response structure
                if (!idData || typeof idData.status !== 'number') {
                    throw new Error('Invalid response from server');
                }
                
                if (idData.status == 200 && idData.result){
                    const videoResponse = await fetch(`https://douyinapis.manho30.me/download?id=${encodeURIComponent(idData.result)}`);
                    
                    if (!videoResponse.ok) {
                        throw new Error(`HTTP error! status: ${videoResponse.status}`);
                    }
                    
                    const videoData = await videoResponse.json();
                    
                    // Validate nested response structure
                    if (!videoData || typeof videoData.status !== 'number') {
                        throw new Error('Invalid response from server');
                    }
                    
                    if (videoData.status == 200 && videoData.result && videoData.result.video){
                        const video = videoData.result.video;
                        
                        // Set title using textContent (safe from XSS)
                        if (video.descriptions) {
                            document.getElementById("title").textContent = video.descriptions;
                        }
                        
                        // Set thumbnail with proper URL handling and alt text
                        if (video.thumbnail_url && video.thumbnail_url.url_list) {
                            const thumbnailUrl = Array.isArray(video.thumbnail_url.url_list) 
                                ? video.thumbnail_url.url_list[0] 
                                : video.thumbnail_url.url_list;
                            thumbnail.src = thumbnailUrl || '';
                            thumbnail.alt = video.descriptions || 'Video thumbnail';
                        }
                        
                        // Create download links safely using DOM APIs
                        const watermarkContainer = document.getElementById("watermark");
                        const noWatermarkContainer = document.getElementById("no_watermark");
                        
                        if (video.video_url && video.video_url.watermark_url) {
                            const watermarkLink = document.createElement('a');
                            watermarkLink.href = video.video_url.watermark_url;
                            watermarkLink.textContent = 'Watermark';
                            watermarkLink.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mx-2 focus:outline-none focus:shadow-outline';
                            watermarkLink.rel = 'noopener noreferrer';
                            watermarkLink.target = '_blank';
                            watermarkContainer.appendChild(watermarkLink);
                        }
                        
                        if (video.video_url && video.video_url.free_watermark_1080p) {
                            const noWatermarkLink = document.createElement('a');
                            noWatermarkLink.href = video.video_url.free_watermark_1080p;
                            noWatermarkLink.textContent = 'No Watermark';
                            noWatermarkLink.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mx-2 focus:outline-none focus:shadow-outline';
                            noWatermarkLink.rel = 'noopener noreferrer';
                            noWatermarkLink.target = '_blank';
                            noWatermarkContainer.appendChild(noWatermarkLink);
                        }
                    } else {
                        alert(videoData.message || 'Failed to fetch video data');
                    }
                } else {
                    alert(idData.message || 'Failed to fetch video ID');
                }
            } catch (error) {
                console.error('Error fetching video:', error);
                alert('Network error or invalid response. Please try again.');
            } finally {
                // Disable loading state
                downloadBtn.disabled = false;
                loadingIndicator.classList.add('hidden');
            }
        })
    </script>
</div>
<div id="result" aria-live="polite">
    <div id="title" class="my-8 text-center text-gray-500 text-xl mt-10"></div>
    <img id="thumbnail" class="rounded mx-auto block mb-3" alt="">
    <div id='dllist' class='mb-10 my-5 flex flex-wrap text-gray-500 border-gray-200 dark:border-gray-700 dark:text-gray-400 md:flex mt-4 space-x-6 justify-center'>
        <div id="watermark"></div>
        <div id="no_watermark"></div>
    </div>
</div>
